name: Build, push e bump submodule infra em TV30

on:
  push:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pos-consolidacao (fases 2-3 do plano): a borda inteira e uma
          # imagem (edgegateway) e o redis leva seed+commander embutidos.
          # As imagens antigas (gatewayhttps/http, middlewares, swagger)
          # deixam de ser buildadas — remocao dos repositorios no Docker
          # Hub fica pra fase 4, junto do renome R1.
          - name: tv30-mosquitto
            context: ./mqtt-broker
            dockerfile: ./mqtt-broker/infra/Dockerfile
          - name: tv30-edgegateway
            context: ./edgegateway
            dockerfile: ./edgegateway/Dockerfile
          - name: tv30-redis
            context: .
            dockerfile: ./redis/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest

  bump:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (super-projeto)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Atualizar ponteiro do submodule infra
        env:
          INFRA_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "Luis Claudio Ribeiro Junior"
          git config user.email "luis.claudio.r.jr@gmail.com"

          CURRENT=$(git ls-tree HEAD infra | awk '{print $3}')
          if [ "$CURRENT" = "$INFRA_SHA" ]; then
            echo "Ponteiro ja em $INFRA_SHA — sem mudancas"
            exit 0
          fi

          echo "Atualizando ponteiro do submodule infra: $CURRENT -> $INFRA_SHA"
          git update-index --cacheinfo 160000 "$INFRA_SHA" infra

          git commit -m "chore: bump submodule infra pra ${INFRA_SHA:0:7}"

          # Pull --rebase + push retry pra mitigar race com outras actions
          # (varias podem pushar simultaneamente em main do TV30)
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push falhou apos 3 tentativas"
          exit 1
