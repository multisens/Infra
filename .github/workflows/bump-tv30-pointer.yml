name: Build, push and bump the infra submodule in TV30

on:
  push:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tv30-mqtt-broker
            context: ./mqtt-broker
            dockerfile: ./mqtt-broker/infra/Dockerfile
          - name: tv30-edgegateway
            context: ./edgegateway
            dockerfile: ./edgegateway/Dockerfile
          - name: tv30-redis
            context: .
            dockerfile: ./redis/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest

  bump:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (superproject)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Update the infra submodule pointer
        env:
          INFRA_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          CURRENT=$(git ls-tree HEAD infra | awk '{print $3}')
          if [ "$CURRENT" = "$INFRA_SHA" ]; then
            echo "Pointer already at $INFRA_SHA, no changes"
            exit 0
          fi

          echo "Updating the infra submodule pointer: $CURRENT -> $INFRA_SHA"
          git update-index --cacheinfo 160000 "$INFRA_SHA" infra

          git commit -m "chore: bump submodule infra to ${INFRA_SHA:0:7}"

          # Pull --rebase and push, retried, since several workflows may push to
          # the main branch of TV30 at the same time.
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
