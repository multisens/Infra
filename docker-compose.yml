# docker-compose.yml — infra do TV30
#
# Uso:
#   docker compose up -d                   # stack base
#   docker compose --profile mqtt up -d    # stack base + Mosquitto

include:
  - path: ./redis/docker-compose.yml

services:
  # A BORDA num container so (fase 2): superficies externa (44643) e
  # interna (44642, fixa da norma C.3.4) + documentacao (8085), tudo
  # gerado no build a partir da tabela unica de rotas (edgegateway/
  # routes.json — M4). Morre-inteiro: qualquer processo interno caindo
  # derruba o container.
  edgegateway:
    image: ${DOCKERHUB_NS:-tv30}/tv30-edgegateway:${IMAGE_TAG:-latest}
    build:
      context: ./edgegateway
    container_name: edgegateway
    environment:
      # linux = backends via DNS da rede (tv3ws); windows = host.docker.internal
      # (a variante windows tambem serve pro cenario de DESENVOLVIMENTO em
      # Linux: infra em containers + servico rodando no host via npm — ver
      # docs/dev-local.md na raiz do TV30)
      EDGE_VARIANT: ${EDGE_VARIANT:-linux}
      # Validacao de credenciais na borda (plugin tv30-auth, item 9 — ver
      # edgegateway/plugin/README.md). O access token eh emitido pelo tv3ws:
      # JWT_SECRET/JWT_ISSUER tem que ser OS MESMOS dele (mesmo padrao de dev
      # do compose raiz). Na variante windows (dev-host) a borda continua
      # lendo o Redis do container (redis) — correto: e o mesmo Redis.
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # warn (padrao) = nada eh bloqueado, so loga e marca X-TV30-Auth-Warn
      # (clientes como o Guarana ainda nao obtem token); enforce = bloqueia
      # com 404 + corpo C.3.2. Valor invalido derruba o container.
      AUTH_ENFORCE: ${AUTH_ENFORCE:-warn}
    extra_hosts:
      # habilita host.docker.internal em Linux (necessario pro cenario de
      # desenvolvimento com backend no host; inocuo no deploy padrao)
      - "host.docker.internal:host-gateway"
    # Portas: 44642 FIXA (norma, C.3.4). A 44643 tambem e FIXA por padrao na
    # bridge (decisao do Luis em 12/10, revendo a C1 de 11/10): o /manifest do
    # tv3ws anuncia o Server-SecureBaseURL em <host>:44643 (EDGE_HTTPS_PORT,
    # padrao 44643) e nao sabe a porta de host que o Docker escolheria.
    # EDGE_EXT_PUBLISH e o valor que vai em `ports`: `host:container` fixa
    # (padrao 44643:44643; outra porta de host pede o mesmo numero no
    # EDGE_HTTPS_PORT do tv3ws, senao o /manifest anuncia a errada); so o
    # numero (EDGE_EXT_PUBLISH=44643) = porta do container com porta de host
    # livre escolhida pelo Docker, descoberta com
    # `docker compose port edgegateway 44643`, que o /manifest NAO anuncia.
    # De 11/10 (C1, opcao b) a 12/10 o padrao era so o numero. No modo SSDP
    # (rede do host, docker-compose.ssdp.yml da raiz) o `ports` inteiro e
    # zerado e a 44643 fica fixa no host, porque vai no anuncio.
    ports:
      - "44642:44642"   # superficie interna — porta FIXA da norma
      - "${EDGE_EXT_PUBLISH:-44643:44643}"   # superficie externa: porta de host FIXA por padrao (Luis, 12/10)
      - "8085"          # docs: porta de host dinamica (V10)
    depends_on:
      # o preflight (compose raiz) BLOQUEIA a subida se a 44642 estiver
      # ocupada por processo nativo (porta fixa da norma).
      preflight:
        condition: service_completed_successfully
      # o plugin consulta o Redis (clientes bloqueados, origens associadas,
      # servico corrente, chaves de bind-context): so sobe com ele semeado.
      redis:
        condition: service_healthy
    networks:
      - ginga_net
    restart: unless-stopped

  mosquitto:
    image: ${DOCKERHUB_NS:-tv30}/tv30-mosquitto:${IMAGE_TAG:-latest}
    build:
      context: ./mqtt-broker
      dockerfile: infra/Dockerfile
    container_name: mqtt-broker
    profiles:
      - mqtt
    ports:
      - "1883:1883"   # MQTT: porta FIXA (C1)
      # C1 (decisao do Luis em 11/10): o MQTT por WebSocket (9001 do
      # container) sai numa porta de host ALEATORIA por padrao — descobrir com
      # `docker compose port mosquitto 9001`. MQTT_WS_PUBLISH e o valor que vai
      # em `ports`: so o numero (padrao 9001) = porta do container com porta de
      # host aleatoria; `host:container` fixa (ex.: MQTT_WS_PUBLISH=9003:9001).
      # Substitui o MQTT_WS_PORT neste publish (ate 11/10,
      # "${MQTT_WS_PORT:-9001}:9001", porta de host fixa). A pagina da TV nao
      # conecta mais nesta porta: o AoP atende o MQTT por WebSocket na propria
      # porta, no caminho /mqtt, e repassa para a 9001 INTERNA do mosquitto
      # (MQTT_WS_PORT do servico aop, no compose da raiz). No dev-host, com o
      # AoP no host, ele usa a porta publicada (MQTT_WS_PORT = `docker compose
      # port mosquitto 9001`).
      - "${MQTT_WS_PUBLISH:-9001}"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    # O broker nao consulta o Redis (controle de acesso a topicos removido
    # por decisao de desenho) — sem env de Redis e sem barreira sobre a carga.
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
