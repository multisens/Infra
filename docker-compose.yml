# TV30 infrastructure, included by the root docker-compose.yml, which defines
# the preflight and tls-init services the edgegateway depends on; it does
# not start on its own. In the TV30 root:
#   whole stack (COMPOSE_PROFILES of .env):
#     docker compose up -d
#   only the infrastructure images:
#     docker compose --profile mqtt build edgegateway redis mosquitto

include:
  - path: ./redis/docker-compose.yml

services:
  # Edge in a single container: external (44643) and internal (44642, C.3.4)
  # surfaces and documentation (8085), generated at build time from
  # edgegateway/routes.json. If an inner process exits, the container exits.
  edgegateway:
    image: ${DOCKERHUB_NS:-tv30}/tv30-edgegateway:${IMAGE_TAG:-latest}
    build:
      context: ./edgegateway
    container_name: edgegateway
    environment:
      # linux: backends by the network DNS; windows: host.docker.internal, also
      # for the dev-host on Linux, with the service running on the host.
      EDGE_VARIANT: ${EDGE_VARIANT:-linux}
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
      # redis also in the windows variant.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # enforce: refusal with 404 and a C.3.2 body; warn: the credential
      # refusals (104, 107, 108) are only logged and marked with
      # X-TV30-Auth-Warn. An invalid value brings the container down.
      AUTH_ENFORCE: ${AUTH_ENFORCE:-enforce}
    extra_hosts:
      # host.docker.internal on Linux, for the dev-host.
      - "host.docker.internal:host-gateway"
    ports:
      # Internal surface, port fixed by the standard (C.3.4).
      - "44642:44642"
      # External surface.
      - "${EDGE_EXT_PUBLISH:-44643:44643}"
      # Documentation, on a host port chosen by Docker.
      - "8085"
    depends_on:
      # The preflight stops the startup if 44642 is in use.
      preflight:
        condition: service_completed_successfully
      # The plugin reads Redis.
      redis:
        condition: service_healthy
      # Receiver certificate.
      tls-init:
        condition: service_completed_successfully
    volumes:
      # TLS certificate of the external surface.
      - ../.tv30/tls:/etc/tv30/tls:ro
    networks:
      - ginga_net
    restart: unless-stopped

  mosquitto:
    image: ${DOCKERHUB_NS:-tv30}/tv30-mosquitto:${IMAGE_TAG:-latest}
    build:
      context: ./mqtt-broker
      dockerfile: infra/Dockerfile
    container_name: mqtt-broker
    profiles:
      - mqtt
    ports:
      - "1883:1883"
      # MQTT over WebSocket: a host port chosen by Docker by default
      # (`docker compose port mosquitto 9001`); MQTT_WS_PUBLISH=9003:9001 fixes
      # it.
      - "${MQTT_WS_PUBLISH:-9001}"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
