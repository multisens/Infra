# docker-compose.yml — raiz do aop_infra
#
# Uso:
#   docker compose up -d                   # stack base
#   docker compose --profile mqtt up -d    # stack base + Mosquitto

include:
  - path: ./redis/docker-compose.yml
  - path: ./middleware/docker-compose.yml
  - path: ./middleware_internal/docker-compose.yml
  - path: ./krakenD_external/docker-compose.yml
  - path: ./krakenD_internal/docker-compose.yml
  - path: ./swagger/docker-compose.yml

services:
  redis-seed:
    image: python:3.11-alpine
    container_name: redis-seed
    command: sh -c "pip install redis -q && python /migrate.py"
    volumes:
      # ACL fica no mosquitto_plugin (config nativo do broker); userData vem do
      # user-files-template — fonte unica de verdade, mesmo arquivo embarcado
      # nas imagens do AoP e CCWS (evita drift entre seeds).
      - ./mosquitto_plugin/plugin/config/acl.json:/mosquitto/config/acl.json:ro
      - ./user-files-template/userData.json:/mosquitto/config/userData.json:ro
      - ./mosquitto_plugin/infra/migrate_to_redis.py:/migrate.py:ro
    depends_on:
      - redis
    networks:
      - ginga_net
    restart: "no"

  mosquitto:
    image: ${DOCKERHUB_NS:-tv30}/tv30-mosquitto:${IMAGE_TAG:-latest}
    build:
      context: ./mosquitto_plugin
      dockerfile: infra/Dockerfile
    container_name: mqtt-broker
    profiles:
      - mqtt
    ports:
      - "1883:1883"
      # MQTT_WS_PORT default 9001 (Linux puro). Em Windows+WSL com 9001/9002
      # ocupadas no host, definir MQTT_WS_PORT=9003 no .env da raiz do TV30.
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis-seed:
        condition: service_completed_successfully
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
