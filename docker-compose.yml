# Infra do TV30, incluida pelo docker-compose.yml da raiz (que define o preflight
# e o tls-init de que o edgegateway depende); sozinho nao sobe. Na raiz do TV30:
#   docker compose up -d                                         # stack inteira (COMPOSE_PROFILES do .env)
#   docker compose --profile mqtt build edgegateway redis mosquitto  # so as imagens da infra

include:
  - path: ./redis/docker-compose.yml

services:
  # Borda num container so: superficies externa (44643) e interna (44642, C.3.4)
  # e documentacao (8085), geradas no build de edgegateway/routes.json. Se um
  # processo interno cai, o container cai.
  edgegateway:
    image: ${DOCKERHUB_NS:-tv30}/tv30-edgegateway:${IMAGE_TAG:-latest}
    build:
      context: ./edgegateway
    container_name: edgegateway
    environment:
      # linux = backends pelo DNS da rede; windows = host.docker.internal (serve
      # tambem ao dev-host em Linux, com o servico rodando no host)
      EDGE_VARIANT: ${EDGE_VARIANT:-linux}
      # JWT_SECRET/JWT_ISSUER tem de ser os do tv3ws, que emite o access token.
      # REDIS_HOST fica redis tambem na variante windows: o Redis e o do container.
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # enforce = recusa com 404 e corpo C.3.2; warn (transitorio) = as recusas de
      # credencial (104, 107, 108) so logam e marcam X-TV30-Auth-Warn. 100, 106,
      # 300 e 200 saem nos dois modos. Valor invalido derruba o container.
      AUTH_ENFORCE: ${AUTH_ENFORCE:-enforce}
    extra_hosts:
      # host.docker.internal em Linux, para o dev-host (inocuo no deploy padrao)
      - "host.docker.internal:host-gateway"
    # 44643 fixa por padrao: o /manifest do tv3ws anuncia <host>:EDGE_HTTPS_PORT e
    # nao conhece a porta que o Docker escolheria. Outra porta de host pede o mesmo
    # numero no EDGE_HTTPS_PORT do tv3ws; so o numero (EDGE_EXT_PUBLISH=44643)
    # deixa o Docker escolher, e o /manifest nao a anuncia.
    ports:
      - "44642:44642"   # superficie interna, porta fixa da norma (C.3.4)
      - "${EDGE_EXT_PUBLISH:-44643:44643}"   # superficie externa
      - "8085"          # docs: porta de host dinamica
    depends_on:
      # o preflight (compose raiz) barra a subida se a 44642 estiver ocupada
      preflight:
        condition: service_completed_successfully
      # o plugin le o Redis (clientes bloqueados, origens, servico corrente, bind-context)
      redis:
        condition: service_healthy
      # certificado do receptor (compose raiz)
      tls-init:
        condition: service_completed_successfully
    volumes:
      # TLS da 44643, terminado na borda
      - ../.tv30/tls:/etc/tv30/tls:ro
    networks:
      - ginga_net
    restart: unless-stopped

  mosquitto:
    image: ${DOCKERHUB_NS:-tv30}/tv30-mosquitto:${IMAGE_TAG:-latest}
    build:
      context: ./mqtt-broker
      dockerfile: infra/Dockerfile
    container_name: mqtt-broker
    profiles:
      - mqtt
    ports:
      - "1883:1883"   # MQTT: porta fixa
      # MQTT por WebSocket: porta de host aleatoria por padrao (`docker compose
      # port mosquitto 9001`); MQTT_WS_PUBLISH=9003:9001 a fixa. A pagina da TV
      # usa o /mqtt do AoP, que repassa para a 9001 interna; no dev-host o AoP
      # usa a porta publicada.
      - "${MQTT_WS_PUBLISH:-9001}"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    # o broker nao consulta o Redis: sem env de Redis nem depends_on
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
