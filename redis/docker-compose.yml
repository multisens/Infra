services:
  # Redis consolidado (fase 3): server + carga inicial no entrypoint +
  # redis-commander embutido como processo auxiliar de debug.
  # Healthcheck so fica saudavel APOS a carga (chave seed:done) — quem
  # precisa do estado semeado depende de service_healthy.
  redis:
    image: ${DOCKERHUB_NS:-tv30}/tv30-redis:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: redis/Dockerfile
    container_name: redis
    ports:
      - "6379:6379"   # fixa por convencao (plano, V10)
      - "18081"       # UI do commander: porta de host DINAMICA (V10)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --raw EXISTS seed:done)\" = \"1\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
