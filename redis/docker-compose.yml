services:
  # Redis com a biblioteca de funcoes tv30, a carga inicial e o redis-commander
  # (debug); se o redis-server ou o commander cair, o container cai. Saudavel so
  # depois de a biblioteca carregar nesta partida e a carga estar aplicada.
  redis:
    image: ${DOCKERHUB_NS:-tv30}/tv30-redis:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: redis/Dockerfile
    container_name: redis
    ports:
      # 6379 so em 127.0.0.1: aberta a rede, um aparelho gravaria nas origens
      # associadas ou nas chaves de bind e contornaria a borda. Sem senha nem ACL:
      # escrita fora das funcoes fica vedada por convencao.
      - "127.0.0.1:6379:6379"
      - "18081"       # UI do commander: porta de host dinamica, com login
    environment:
      # usuario e senha so na UI do commander (a 6379 segue sem senha); valor
      # vazio cai no padrao, o mesmo do entrypoint
      REDIS_COMMANDER_USER: ${REDIS_COMMANDER_USER:-admin}
      REDIS_COMMANDER_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-tv30-redis-admin}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/tv30-redis-pronto && test \"$$(redis-cli --raw EXISTS seed:done)\" = \"1\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
