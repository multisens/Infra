services:
  # Redis consolidado (fase 3): server + biblioteca de funcoes (P4) + carga
  # inicial no entrypoint + redis-commander embutido como processo auxiliar
  # de debug. Morre-inteiro (C2, decisao do Luis em 11/10): se o redis-server
  # ou o commander cair, o container cai e o restart o traz de volta.
  # Healthcheck so fica saudavel APOS a biblioteca de funcoes
  # carregar NESTA partida e a carga estar aplicada (marca
  # /tmp/tv30-redis-pronto, que o entrypoint cria, e chave seed:done) — quem
  # precisa do estado semeado e das funcoes depende de service_healthy.
  redis:
    image: ${DOCKERHUB_NS:-tv30}/tv30-redis:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: redis/Dockerfile
    container_name: redis
    ports:
      - "6379:6379"   # fixa por convencao (plano, V10); SEM senha (D-L1)
      - "18081"       # UI do commander: porta de host DINAMICA (V10), com login
    environment:
      # D-L1 (Luis, 03/10): usuario e senha SO na UI do commander; a conexao
      # com o banco (6379) segue sem senha. Troque no .env da raiz. Valor
      # vazio cai no padrao (o entrypoint repete o mesmo padrao).
      REDIS_COMMANDER_USER: ${REDIS_COMMANDER_USER:-admin}
      REDIS_COMMANDER_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-tv30-redis-admin}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/tv30-redis-pronto && test \"$$(redis-cli --raw EXISTS seed:done)\" = \"1\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
