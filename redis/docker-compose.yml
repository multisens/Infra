services:
  # Redis with the tv30 function library, the initial load and
  # redis-commander (debug); if redis-server or the commander exits, the
  # container exits. Healthy only after the library loaded in this start and
  # the load is applied.
  redis:
    image: ${DOCKERHUB_NS:-tv30}/tv30-redis:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: redis/Dockerfile
    container_name: redis
    ports:
      # 6379 only on 127.0.0.1.
      - "127.0.0.1:6379:6379"
      # Commander UI, with login, on a host port chosen by Docker.
      - "18081"
    environment:
      # User and password only for the commander UI; an empty value falls back
      # to the default.
      REDIS_COMMANDER_USER: ${REDIS_COMMANDER_USER:-admin}
      REDIS_COMMANDER_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-tv30-redis-admin}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/tv30-redis-pronto && test \"$$(redis-cli --raw EXISTS seed:done)\" = \"1\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ginga_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  ginga_net:
    name: ginga_net
    driver: bridge
